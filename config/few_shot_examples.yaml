educational:
  - text: Madu nyaris nggak pernah basi karena kadar airnya rendah dan sifatnya asam, jadi bakteri susah hidup di dalamnya. Yang basi biasanya bukan madunya, tapi wadah yang kemasukan air.
    sourceNote: Smithsonian Magazine, "The Science Behind Honey's Eternal Shelf Life" (2013)
    confidence: high
  - text: Yang benar "mengubah", bukan "merubah". Kata dasarnya "ubah", sedangkan "rubah" itu hewan. Jadi kalau kamu merubah sesuatu, secara teknis kamu lagi berubah jadi rubah.
    sourceNote: KBBI daring, lema "ubah" dan "rubah"
    confidence: high
  - text: Secara botani, pisang termasuk buah beri, sedangkan stroberi justru bukan. Ilmu tumbuhan memang suka bikin kita ragu sama isi kulkas sendiri.
    sourceNote: Encyclopaedia Britannica, "Is a Banana a Berry?"
    confidence: high
  - text: Borobudur dibangun sekitar abad ke-8 sampai ke-9 di masa Wangsa Syailendra. Umurnya lebih tua dari Angkor Wat, dan sejak 1991 masuk daftar Warisan Dunia UNESCO.
    sourceNote: UNESCO World Heritage List, "Borobudur Temple Compounds" (inscribed 1991)
    confidence: high

educational_thread:
  - text: Password kamu mungkin lebih gampang ditebak daripada yang kamu kira. Ini cara bikin akun lebih aman tanpa harus hafal kode rumit 🧵
    thread:
      - 1. Pakai kalimat sandi, bukan kata sandi. Empat kata acak yang panjang lebih susah ditebak daripada satu kata dengan simbol aneh.
      - 2. Satu akun, satu password. Kalau satu situs bocor, akun lain nggak ikut kebuka.
      - 3. Pakai password manager biar kamu cukup ingat satu password utama.
      - 4. Nyalakan verifikasi dua langkah, terutama di email. Email itu kunci cadangan semua akunmu.
      - 5. Jangan kirim kode OTP ke siapa pun, termasuk yang ngaku petugas.
      - Intinya, panjang dan unik lebih penting daripada rumit. Kamu sendiri sekarang pakai password manager atau masih andalkan ingatan?
  - text: Mau mulai lari tapi tiap coba selalu ngos-ngosan di menit kelima? Ini urutan yang lebih masuk akal buat pemula 🧵
    thread:
      - 1. Mulai dari jalan cepat 20 menit, tiga kali seminggu. Badan perlu kebiasaan dulu, bukan kecepatan.
      - 2. Masuk ke selang-seling, lari 1 menit lalu jalan 2 menit, ulangi beberapa kali.
      - 3. Tiap minggu tambah porsi larinya sedikit, kurangi jalannya.
      - 4. Atur tempo sampai kamu masih bisa ngobrol. Kalau nggak bisa ngomong, kamu kecepetan.
      - 5. Kasih jeda sehari di antara hari lari supaya kaki sempat pulih.
      - Kuncinya konsisten pelan-pelan, bukan langsung jauh. Kamu tim lari pagi atau sore?
  - text: Laptop lemot nggak selalu harus diganti. Coba cek lima hal ini dulu sebelum keluar duit 🧵
    thread:
      - 1. Lihat aplikasi yang ikut nyala waktu laptop baru hidup, matikan yang nggak perlu.
      - 2. Tutup tab browser yang numpuk. Puluhan tab itu makan memori diam-diam.
      - 3. Sisakan ruang kosong di penyimpanan, jangan sampai penuh mepet.
      - 4. Update sistem dan driver, kadang lemotnya karena bug lama.
      - 5. Bersihkan debu di lubang kipas. Laptop yang kepanasan sengaja menurunkan kecepatannya.
      - Kalau semua sudah dicoba dan masih lemot, baru deh pertimbangkan upgrade. Laptopmu udah umur berapa tahun?

