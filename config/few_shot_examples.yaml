hot_take:
  - text: Dashboard yang bagus bukan yang grafiknya paling banyak, tapi yang bikin orang berhenti nanya, "Angka ini dari mana?"
  - text: Rapat satu jam yang bisa diganti satu pesan itu bukan kolaborasi, itu kebiasaan. Waktu orang juga anggaran.
  - text: Bangun jam 4 pagi nggak otomatis bikin produktif. Yang bikin produktif itu tidur cukup, jam berapa pun kamu bangun.
  - text: Belajar coding nggak harus mulai dari bahasa yang paling populer. Mulailah dari masalah yang pengin kamu selesaikan, alatnya menyusul.

storytelling:
  # Scenarios and context-based stories: nothing here is presented as the owner's real experience.
  - text: Ada mahasiswa yang selalu menahan pertanyaan karena takut kelihatan bodoh. Suatu hari ada yang akhirnya angkat tangan, dan setengah kelas langsung lega karena mereka juga bingung. Pertanyaan yang ditahan cuma bikin bingung bareng-bareng.
  - text: Bayangin presentasi pertama di kantor, slide kebalik urutannya dan baru sadar di tengah jalan. Ketawa sebentar, minta waktu, lanjut. Ternyata orang lebih ingat cara membereskannya daripada kesalahannya.
  - text: Ada orang yang menunda bayar tagihan kecil karena merasa "nanti juga ingat". Dendanya akhirnya lebih besar dari tagihannya. Sejak itu semua tagihan dipasang pengingat, sekecil apa pun.

