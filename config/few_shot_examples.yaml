  - text: Ikan hiu beli roti, sabar ya gajian masih lama sekali.
  - text: Katanya hidup harus seimbang, makanya habis makan besar aku langsung rebahan biar adil.

one_liner_satire:
  - text: Deadline tinggal besok, tapi inspirasi baru datang jam 11 malam. Otak kita ini freelancer yang minta DP dulu.
  - text: Grup kantor sepi seharian, begitu jam pulang tiba langsung ramai diskusi kerjaan. Rajinnya selalu lembur sukarela.
  - text: Aplikasi minta update tiap minggu biar lebih baik. Yang membaik cuma ukurannya.
  - text: Katanya kuliah biar bisa berpikir kritis. Begitu kritis ke dosen, nilainya yang jadi kritis.

