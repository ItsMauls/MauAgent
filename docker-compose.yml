services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: mauagent, POSTGRES_PASSWORD: mauagent, POSTGRES_DB: mauagent }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  # Create the bucket (MinIO allows CORS for presigned PUTs from the browser by default).
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set l http://minio:9000 minioadmin minioadmin && mc mb -p l/mauagent"
volumes: { pg: {}, minio: {} }
